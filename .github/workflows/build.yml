name: Flutter Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create .env for CI
        working-directory: rifq
        run: touch .env

      - name: Get dependencies
        working-directory: rifq
        run: flutter pub get

      - name: Build APK
        working-directory: rifq
        run: flutter build apk --release
